<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake3D</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0c05;
    overflow:hidden; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Share Tech Mono',monospace; color:#c8e8a0;
  }
  #hud {
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 28px; z-index:10;
    background:linear-gradient(to bottom,rgba(5,8,3,0.92),transparent);
  }
  #title {
    font-family:'Cinzel',serif; font-size:20px; font-weight:900;
    letter-spacing:8px; color:#7ec850;
    text-shadow:0 0 15px rgba(120,200,60,0.6),0 0 30px rgba(80,160,30,0.3);
  }
  #score { font-family:'Cinzel',serif; font-size:30px; font-weight:700; color:#a8d870; text-shadow:0 0 10px rgba(150,220,80,0.5); }
  #score-label,#hi-score { font-size:9px; letter-spacing:3px; color:#4a7030; }
  #score-box { text-align:right; }
  #level-box { font-size:9px; letter-spacing:3px; color:#4a7030; text-align:center; }
  #level { font-family:'Cinzel',serif; font-size:18px; color:#8dbc58; }
  #canvas-wrap { position:relative; z-index:1; }
  canvas { display:block; border:1px solid rgba(80,140,30,0.25); box-shadow:0 0 60px rgba(40,100,10,0.2),0 0 120px rgba(20,60,5,0.15); }
  #controls { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:2px; color:rgba(100,160,50,0.35); z-index:10; }
  #overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(5,8,3,0.88); backdrop-filter:blur(6px);
    z-index:5; transition:opacity 0.5s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h2 {
    font-family:'Cinzel',serif; font-size:48px; font-weight:900;
    letter-spacing:10px; color:#7ec850;
    text-shadow:0 0 30px rgba(120,200,60,0.7),0 0 80px rgba(80,160,30,0.4);
    margin-bottom:6px;
  }
  #overlay .sub { font-size:11px; letter-spacing:5px; color:#3a6020; margin-bottom:44px; }
  #overlay .final-score { font-family:'Cinzel',serif; font-size:16px; color:#c8e8a0; margin-bottom:44px; display:none; }
  #overlay .final-score span { color:#a8d870; font-size:38px; display:block; text-shadow:0 0 20px rgba(150,220,80,0.6); }
  #start-btn {
    font-family:'Cinzel',serif; font-size:13px; font-weight:700; letter-spacing:6px;
    padding:14px 52px; background:transparent; border:1px solid #5a9030;
    color:#7ec850; cursor:pointer; position:relative; overflow:hidden;
    transition:all 0.3s; text-transform:uppercase;
  }
  #start-btn::before {
    content:''; position:absolute; inset:0; background:#3a6818;
    transform:scaleX(0); transform-origin:left; transition:transform 0.3s; z-index:-1;
  }
  #start-btn:hover { color:#d0f080; box-shadow:0 0 25px rgba(80,160,30,0.4); border-color:#7ec850; }
  #start-btn:hover::before { transform:scaleX(1); }
  .key-hint { font-size:10px; color:rgba(100,160,50,0.3); letter-spacing:3px; margin-top:18px; }
</style>
</head>
<body>
<div id="hud">
  <div id="title">SERPENT</div>
  <div id="level-box">LEVEL<br><span id="level">1</span></div>
  <div id="score-box">
    <div id="score-label">SCORE</div>
    <div id="score">0</div>
    <div id="hi-score">BEST: <span id="best">0</span></div>
  </div>
</div>
<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="overlay">
    <h2>SERPENT</h2>
    <div class="sub">REALISTIC SNAKE</div>
    <div class="final-score" id="final-score">SCORE <span id="final-num">0</span></div>
    <button id="start-btn" onclick="startGame()">HUNT</button>
    <div class="key-hint">WASD / ARROWS &nbsp;·&nbsp; SPACE PAUSE &nbsp;·&nbsp; R RESTART</div>
  </div>
</div>
<div id="controls">WASD / ARROWS — MOVE &nbsp;·&nbsp; SPACE — PAUSE &nbsp;·&nbsp; R — RESTART</div>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl',{antialias:true}) || canvas.getContext('experimental-webgl');
const SIZE = Math.min(window.innerWidth, window.innerHeight) - 110;
canvas.width = SIZE; canvas.height = SIZE;

// ═══════════════════════════════════════════════
// SHADERS
// ═══════════════════════════════════════════════
const VS = `
precision mediump float;
attribute vec3 aPos;
attribute vec3 aNorm;
attribute vec3 aCol;
attribute vec2 aUV;
attribute float aMat;
uniform mat4 uMVP;
varying vec3 vPos; varying vec3 vNorm; varying vec3 vCol;
varying vec2 vUV; varying float vMat; varying float vDepth;
void main(){
  vPos=aPos; vNorm=aNorm; vCol=aCol; vUV=aUV; vMat=aMat;
  vec4 p=uMVP*vec4(aPos,1.0);
  vDepth=p.z/p.w;
  gl_Position=p;
}`;

const FS = `
precision mediump float;
varying vec3 vPos; varying vec3 vNorm; varying vec3 vCol;
varying vec2 vUV; varying float vMat; varying float vDepth;
uniform vec3 uCamPos; uniform float uTime; uniform float uFoodGlow;

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){v+=a*noise(p);p*=2.1;a*=0.5;} return v; }

float scalePat(vec2 uv){
  vec2 g=uv*vec2(5.0,9.0); g.x+=0.5*floor(g.y);
  vec2 f=fract(g)-0.5; float d=length(f);
  return smoothstep(0.48,0.36,d);
}
float scaleRidge(vec2 uv){
  vec2 g=uv*vec2(5.0,9.0); g.x+=0.5*floor(g.y);
  vec2 f=fract(g)-0.5; float d=length(f);
  return smoothstep(0.5,0.28,d)-smoothstep(0.28,0.08,d);
}

void main(){
  vec3 N=normalize(vNorm);
  vec3 V=normalize(uCamPos-vPos);
  vec3 L1=normalize(vec3(4.0,12.0,6.0));
  vec3 L2=normalize(vec3(-8.0,5.0,-4.0));
  vec3 L3=normalize(vec3(0.0,4.0,-10.0));
  float mat=floor(vMat+0.5);
  vec3 col=vCol;

  if(mat<0.5){
    // GROUND
    float n1=fbm(vUV*2.5); float n2=fbm(vUV*7.0+1.7);
    float moss=smoothstep(0.44,0.6,n1);
    vec3 mossC=vec3(0.10,0.20,0.05)+n2*vec3(0.04,0.06,0.01);
    vec3 dirtC=vec3(0.16,0.12,0.07)+n2*vec3(0.04,0.03,0.01);
    col=mix(dirtC,mossC,moss)*(0.7+0.3*n2);
    float stoneM=step(0.75,hash(floor(vUV*4.5)));
    col=mix(col,vec3(0.20,0.18,0.16)+noise(vUV*11.0)*0.04,stoneM*0.55);
    float diff1=max(dot(N,L1),0.0)*0.7;
    float diff2=max(dot(N,L2),0.0)*0.2;
    col=col*(0.18+diff1+diff2);
    float edge=min(min(vPos.x+10.0,10.0-vPos.x),min(vPos.z+10.0,10.0-vPos.z));
    col=mix(col,vec3(0.03,0.05,0.01)*0.4,smoothstep(2.0,0.0,edge)*0.5);

  } else if(mat<1.5){
    // SNAKE
    float scl=scalePat(vUV);
    float ridge=scaleRidge(vUV);
    float n=noise(vUV*18.0+3.0);
    float band=sin(vUV.y*3.14159*6.0)*0.5+0.5;
    band=smoothstep(0.25,0.75,band);
    vec3 scaleLight=vCol*(1.0+0.35*scl);
    vec3 scaleDark=vCol*(0.45+0.12*n);
    vec3 scaleColor=mix(scaleDark,scaleLight,band*0.55+0.22);
    // Pattern: darker saddle blotches (like a ball python)
    float blotch=sin(vUV.y*3.14159*2.5)*0.5+0.5;
    blotch=smoothstep(0.4,0.65,blotch)*0.4;
    scaleColor=mix(scaleColor,scaleColor*vec3(0.3,0.5,0.2),blotch);
    // Perturb normal with ridge
    vec3 Np=normalize(N+ridge*0.5*vec3(0.15,0.0,0.15));
    float diff1=max(dot(Np,L1),0.0);
    float diff2=max(dot(Np,L2),0.0)*0.35;
    float diff3=max(dot(Np,L3),0.0)*0.18;
    vec3 H1=normalize(L1+V);
    float spec1=pow(max(dot(Np,H1),0.0),90.0)*(0.25+0.5*scl);
    vec3 H3=normalize(L3+V);
    float spec3=pow(max(dot(Np,H3),0.0),130.0)*0.18*scl;
    // SSS
    float sss=pow(max(dot(-L1,V),0.0),3.0)*0.06;
    // Fresnel
    float fres=pow(1.0-max(dot(N,V),0.0),3.0)*0.22;
    col=scaleColor*(0.07+diff1*vec3(1.0,0.95,0.8)+diff2*vec3(0.4,0.55,0.8)+diff3*0.5)
        +spec1*vec3(1.0,0.97,0.85)+spec3*vec3(0.7,0.9,1.0)
        +vec3(0.5,0.85,0.2)*sss+vec3(0.45,0.85,0.2)*fres;

  } else if(mat<2.5){
    // FOOD (mouse)
    float fur=fbm(vUV*10.0);
    float n=noise(vUV*14.0);
    vec3 furC=vCol*(0.55+0.55*fur)+vec3(0.04,0.02,0.01)*n;
    float diff1=max(dot(N,L1),0.0)*0.85;
    float diff2=max(dot(N,L2),0.0)*0.3;
    float spec=pow(max(dot(normalize(L1+V),N),0.0),10.0)*0.08;
    float glow=uFoodGlow*0.7;
    col=furC*(0.10+diff1+diff2)+spec+vec3(0.9,0.4,0.15)*glow;

  } else {
    // ENV
    float n=fbm(vUV*3.5);
    col=vCol*(0.45+0.55*n);
    float diff1=max(dot(N,L1),0.0)*0.65;
    float diff2=max(dot(N,L2),0.0)*0.25;
    col=col*(0.12+diff1+diff2);
  }

  // Depth fog
  float fog=smoothstep(0.2,1.0,vDepth*0.5+0.5);
  col=mix(col,vec3(0.03,0.07,0.01),fog*0.3);
  // ACES tone map
  col=col*(col*2.51+0.03)/(col*(col*2.43+0.59)+0.14);
  col=clamp(col,0.0,1.0);
  col=pow(col,vec3(0.88));
  gl_FragColor=vec4(col,1.0);
}`;

function mkShader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,mkShader(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkShader(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const A_POS =gl.getAttribLocation(prog,'aPos');
const A_NORM=gl.getAttribLocation(prog,'aNorm');
const A_COL =gl.getAttribLocation(prog,'aCol');
const A_UV  =gl.getAttribLocation(prog,'aUV');
const A_MAT =gl.getAttribLocation(prog,'aMat');
const U_MVP =gl.getUniformLocation(prog,'uMVP');
const U_CAM =gl.getUniformLocation(prog,'uCamPos');
const U_TIME=gl.getUniformLocation(prog,'uTime');
const U_FGLOW=gl.getUniformLocation(prog,'uFoodGlow');

gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.viewport(0,0,SIZE,SIZE);

// ═══════════════════════════════════════════════
// MATH
// ═══════════════════════════════════════════════
const m4=()=>new Float32Array(16);
function identity(m){m.fill(0);m[0]=m[5]=m[10]=m[15]=1;return m;}
function mul(o,a,b){
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    o[j*4+i]=0;for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];
  }return o;
}
function perspective(o,fov,asp,n,f){
  const t=1/Math.tan(fov/2);o.fill(0);
  o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o;
}
function lookAt(o,eye,ctr,up){
  let fx=ctr[0]-eye[0],fy=ctr[1]-eye[1],fz=ctr[2]-eye[2];
  let fl=Math.sqrt(fx*fx+fy*fy+fz*fz);fx/=fl;fy/=fl;fz/=fl;
  let rx=fy*up[2]-fz*up[1],ry=fz*up[0]-fx*up[2],rz=fx*up[1]-fy*up[0];
  let rl=Math.sqrt(rx*rx+ry*ry+rz*rz);rx/=rl;ry/=rl;rz/=rl;
  let ux=ry*fz-rz*fy,uy=rz*fx-rx*fz,uz=rx*fy-ry*fx;
  o[0]=rx;o[1]=ux;o[2]=-fx;o[3]=0;
  o[4]=ry;o[5]=uy;o[6]=-fy;o[7]=0;
  o[8]=rz;o[9]=uz;o[10]=-fz;o[11]=0;
  o[12]=-(rx*eye[0]+ry*eye[1]+rz*eye[2]);
  o[13]=-(ux*eye[0]+uy*eye[1]+uz*eye[2]);
  o[14]= (fx*eye[0]+fy*eye[1]+fz*eye[2]);
  o[15]=1;return o;
}

// ═══════════════════════════════════════════════
// MESH BUILDER  (12 floats/vertex: pos3 norm3 col3 uv2 mat1)
// ═══════════════════════════════════════════════
const VSTRIDE=12;
class MB {
  constructor(){ this.v=[]; this.i=[]; this.b=0; }
  quad(v0,v1,v2,v3){
    const b=this.b;
    this.i.push(b,b+1,b+2,b,b+2,b+3);
    this.b+=4;
    this.v.push(...v0,...v1,...v2,...v3);
  }
  box(cx,cy,cz,sx,sy,sz,col,mat,us){
    const [r,g,b]=col;const m=mat||0;const u=us||1;
    const hx=sx/2,hy=sy/2,hz=sz/2;
    const faces=[
      {n:[0,1,0], c:[[-hx,hy,-hz],[hx,hy,-hz],[hx,hy,hz],[-hx,hy,hz]], ua:[1,0,0],va:[0,0,1]},
      {n:[0,-1,0],c:[[-hx,-hy,hz],[hx,-hy,hz],[hx,-hy,-hz],[-hx,-hy,-hz]],ua:[1,0,0],va:[0,0,-1]},
      {n:[1,0,0], c:[[hx,-hy,-hz],[hx,hy,-hz],[hx,hy,hz],[hx,-hy,hz]],ua:[0,0,1],va:[0,1,0]},
      {n:[-1,0,0],c:[[-hx,-hy,hz],[-hx,hy,hz],[-hx,hy,-hz],[-hx,-hy,-hz]],ua:[0,0,1],va:[0,1,0]},
      {n:[0,0,1], c:[[-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz]],ua:[1,0,0],va:[0,1,0]},
      {n:[0,0,-1],c:[[hx,-hy,-hz],[-hx,-hy,-hz],[-hx,hy,-hz],[hx,hy,-hz]],ua:[1,0,0],va:[0,1,0]},
    ];
    for(const f of faces){
      const vs=f.c.map(c=>{
        const pu=c[0]*f.ua[0]+c[1]*f.ua[1]+c[2]*f.ua[2];
        const pv=c[0]*f.va[0]+c[1]*f.va[1]+c[2]*f.va[2];
        return [cx+c[0],cy+c[1],cz+c[2],...f.n,r,g,b,pu*u,pv*u,m];
      });
      this.quad(...vs);
    }
  }
  sphere(cx,cy,cz,r,col,mat,rings,segs){
    const [cr,cg,cb]=col;const m=mat||1;
    rings=rings||8;segs=segs||12;
    for(let ri=0;ri<rings;ri++){
      const t0=(ri/rings)*Math.PI,t1=((ri+1)/rings)*Math.PI;
      const y0=Math.cos(t0),y1=Math.cos(t1);
      const r0=Math.sin(t0),r1=Math.sin(t1);
      for(let si=0;si<segs;si++){
        const p0=(si/segs)*Math.PI*2,p1=((si+1)/segs)*Math.PI*2;
        const mk=(y,rs,c2,s2,u2,v2)=>{
          const nx=rs*c2,ny=y,nz=rs*s2;
          return [cx+r*nx,cy+r*ny,cz+r*nz,nx,ny,nz,cr,cg,cb,u2,v2,m];
        };
        this.quad(
          mk(y0,r0,Math.cos(p0),Math.sin(p0),si/segs,ri/rings),
          mk(y0,r0,Math.cos(p1),Math.sin(p1),(si+1)/segs,ri/rings),
          mk(y1,r1,Math.cos(p1),Math.sin(p1),(si+1)/segs,(ri+1)/rings),
          mk(y1,r1,Math.cos(p0),Math.sin(p0),si/segs,(ri+1)/rings),
        );
      }
    }
  }
  cyl(x0,y0,z0,x1,y1,z1,r0,r1,col,mat,uv0,uv1,segs){
    const [cr,cg,cb]=col;const m=mat||1;const N=segs||10;
    const dx=x1-x0,dy=y1-y0,dz=z1-z0;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
    const ax=dx/len,ay=dy/len,az=dz/len;
    let tx=0,ty=1,tz=0;
    if(Math.abs(ay)>0.99){tx=1;ty=0;tz=0;}
    let bx=ay*tz-az*ty,by=az*tx-ax*tz,bz=ax*ty-ay*tx;
    let bl=Math.sqrt(bx*bx+by*by+bz*bz);bx/=bl;by/=bl;bz/=bl;
    const cx2=ay*bz-az*by,cy2=az*bx-ax*bz,cz2=ax*by-ay*bx;
    for(let i=0;i<N;i++){
      const a0=(i/N)*Math.PI*2,a1=((i+1)/N)*Math.PI*2;
      const c0=Math.cos(a0),s0=Math.sin(a0),c1=Math.cos(a1),s1=Math.sin(a1);
      const n0x=c0*bx+s0*cx2,n0y=c0*by+s0*cy2,n0z=c0*bz+s0*cz2;
      const n1x=c1*bx+s1*cx2,n1y=c1*by+s1*cy2,n1z=c1*bz+s1*cz2;
      const p00x=x0+r0*(c0*bx+s0*cx2),p00y=y0+r0*(c0*by+s0*cy2),p00z=z0+r0*(c0*bz+s0*cz2);
      const p01x=x0+r0*(c1*bx+s1*cx2),p01y=y0+r0*(c1*by+s1*cy2),p01z=z0+r0*(c1*bz+s1*cz2);
      const p10x=x1+r1*(c0*bx+s0*cx2),p10y=y1+r1*(c0*by+s0*cy2),p10z=z1+r1*(c0*bz+s0*cz2);
      const p11x=x1+r1*(c1*bx+s1*cx2),p11y=y1+r1*(c1*by+s1*cy2),p11z=z1+r1*(c1*bz+s1*cz2);
      this.quad(
        [p00x,p00y,p00z,n0x,n0y,n0z,cr,cg,cb,i/N,uv0,m],
        [p01x,p01y,p01z,n1x,n1y,n1z,cr,cg,cb,(i+1)/N,uv0,m],
        [p11x,p11y,p11z,n1x,n1y,n1z,cr,cg,cb,(i+1)/N,uv1,m],
        [p10x,p10y,p10z,n0x,n0y,n0z,cr,cg,cb,i/N,uv1,m],
      );
    }
  }
  upload(){
    const vb=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,vb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(this.v),gl.DYNAMIC_DRAW);
    const ib=gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(this.i),gl.DYNAMIC_DRAW);
    return {vb,ib,count:this.i.length};
  }
}

function bindMesh(vb,ib){
  const S=VSTRIDE*4;
  gl.bindBuffer(gl.ARRAY_BUFFER,vb);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);
  gl.enableVertexAttribArray(A_POS); gl.vertexAttribPointer(A_POS,3,gl.FLOAT,false,S,0);
  gl.enableVertexAttribArray(A_NORM);gl.vertexAttribPointer(A_NORM,3,gl.FLOAT,false,S,12);
  gl.enableVertexAttribArray(A_COL); gl.vertexAttribPointer(A_COL,3,gl.FLOAT,false,S,24);
  gl.enableVertexAttribArray(A_UV);  gl.vertexAttribPointer(A_UV,2,gl.FLOAT,false,S,36);
  gl.enableVertexAttribArray(A_MAT); gl.vertexAttribPointer(A_MAT,1,gl.FLOAT,false,S,44);
}

// ═══════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════
const GRID=20, CELL=1.0;
const CAMERA_ANGLE=Math.PI*0.15;
let snake,dir,nextDir,food,score,best=0,gameOver,paused,started;
let moveTimer=0,moveInterval=180,level=1,foodPulse=0,time=0;

function initGame(){
  const mid=Math.floor(GRID/2);
  // Snake must be set BEFORE spawnFood so the do-while check works
  snake=[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;gameOver=false;paused=false;
  moveInterval=180;level=1;foodPulse=0;
  food=spawnFood(); // called after snake is ready
  document.getElementById('score').textContent='0';
  document.getElementById('level').textContent='1';
}
function spawnFood(){
  // margin=2 keeps the mouse body fully inside walls visually
  const margin = 2;
  const range = GRID - margin * 2; // e.g. 20 - 4 = 16 valid cells
  let f, attempts = 0;
  do {
    f = {
      x: margin + Math.floor(Math.random() * range),
      y: margin + Math.floor(Math.random() * range)
    };
    attempts++;
    if(attempts > 500) break; // safety fallback
  } while(snake && snake.some(s => s.x === f.x && s.y === f.y));
  return f;
}
function startGame(){ initGame();started=true;document.getElementById('overlay').classList.add('hidden'); }
function showGameOver(){
  gameOver=true;
  if(score>best){best=score;document.getElementById('best').textContent=best;}
  setTimeout(()=>{
    const ov=document.getElementById('overlay');
    ov.querySelector('h2').textContent='DEVOURED';
    ov.querySelector('.sub').textContent='YOU DIED';
    document.getElementById('final-score').style.display='block';
    document.getElementById('final-num').textContent=score;
    document.getElementById('start-btn').textContent='HUNT AGAIN';
    ov.classList.remove('hidden');
  },700);
}

// ═══════════════════════════════════════════════
// SCENE
// ═══════════════════════════════════════════════
const OFF=-(GRID*CELL)/2;
function wx(gx){ return OFF+gx*CELL+CELL/2; }
function wz(gz){ return OFF+gz*CELL+CELL/2; }

function snakeCol(i,total){
  const t=i/Math.max(total-1,1);
  // Ball python-like: emerald head → olive/amber body
  return [0.09+t*0.20, 0.40-t*0.08, 0.05+t*0.02];
}

let staticMesh=null;

function buildStatic(){
  const mb=new MB();
  const gS=GRID*CELL;
  mb.box(0,-0.52,0,gS,0.12,gS,[0.13,0.17,0.07],0,0.5);
  // Taller, more prominent walls — clearly visible from above
  const wc=[0.18,0.24,0.09],wh=1.0,wt=0.7;
  // Inner-face stone color slightly lighter so they pop
  const wTop=[0.22,0.28,0.10];
  mb.box(0, wh/2-0.52, OFF-wt/2, gS+wt*2, wh, wt, wc, 3, 1.2);
  mb.box(0, wh/2-0.52,-OFF+wt/2, gS+wt*2, wh, wt, wc, 3, 1.2);
  mb.box(OFF-wt/2, wh/2-0.52, 0, wt, wh, gS, wc, 3, 1.2);
  mb.box(-OFF+wt/2, wh/2-0.52, 0, wt, wh, gS, wc, 3, 1.2);
  // Corner pillars (slightly taller to emphasize corners)
  const cp=wt*0.9, ch=wh*1.15, cc=[0.20,0.26,0.09];
  mb.box(OFF-wt/2, ch/2-0.52, OFF-wt/2, cp, ch, cp, cc, 3, 1.0);
  mb.box(-OFF+wt/2, ch/2-0.52, OFF-wt/2, cp, ch, cp, cc, 3, 1.0);
  mb.box(OFF-wt/2, ch/2-0.52,-OFF+wt/2, cp, ch, cp, cc, 3, 1.0);
  mb.box(-OFF+wt/2, ch/2-0.52,-OFF+wt/2, cp, ch, cp, cc, 3, 1.0);
  // Scattered rocks — kept away from edges so they don't obscure walls
  const rng=n=>Math.sin(n*127.3+41.1)*0.5+0.5;
  for(let i=0;i<14;i++){
    const rx=(rng(i*3)-0.5)*(gS-5.0);
    const rz=(rng(i*3+1)-0.5)*(gS-5.0);
    const rs=0.06+rng(i*3+2)*0.13;
    mb.sphere(rx,-0.48+rs*0.35,rz,rs,[0.19+rng(i)*0.07,0.16+rng(i+1)*0.05,0.13+rng(i+2)*0.04],3,5,8);
  }
  return mb.upload();
}

function buildDynamic(){
  const mb=new MB();
  const total=snake.length;
  const BY=0.08;
  const R_HEAD=0.36, R_BODY=0.30, R_TAIL=0.04;

  // ── Cylinder segments ──────────────────────────────
  for(let i=0;i<total;i++){
    const s=snake[i];
    const col=snakeCol(i,total);
    const cx=wx(s.x),cz2=wz(s.y);
    const t=i/Math.max(total-1,1);
    const ri=i===0?R_HEAD:R_BODY*(1-t*0.6);

    if(i<total-1){
      const sn=snake[i+1];
      const nx=wx(sn.x),nz=wz(sn.y);
      const t1=(i+1)/Math.max(total-1,1);
      const ri1=i+1===total-1?R_TAIL:R_BODY*(1-t1*0.6);
      const uv0=i/total*5, uv1=(i+1)/total*5;
      mb.cyl(cx,BY,cz2,nx,BY,nz,ri,ri1,col,1,uv0,uv1,12);
    }
    // Joint sphere
    if(i>0&&i<total-1){
      mb.sphere(cx,BY,cz2,ri*1.03,col,1,7,10);
    }
  }

  // ── Head ───────────────────────────────────────────
  const h=snake[0];
  const hx=wx(h.x),hz2=wz(h.y);
  const hc=snakeCol(0,total);
  mb.sphere(hx,BY,hz2,R_HEAD*1.12,hc,1,10,14);
  // Snout
  const ex=dir.x*0.16,ez=dir.y*0.16;
  mb.box(hx+ex,BY,hz2+ez,0.28,R_HEAD*0.9,0.36,hc,1,2.0);

  // Eyes
  const perp={x:-dir.y,y:dir.x};
  const eoX=perp.x*0.21+dir.x*0.26, eoZ=perp.y*0.21+dir.y*0.26;
  const ey=BY+0.20,eR=0.078;
  // Dark eye
  mb.sphere(hx+eoX,ey,hz2+eoZ,eR,[0.03,0.03,0.02],1,6,8);
  mb.sphere(hx-perp.x*0.21+dir.x*0.26,ey,hz2-perp.y*0.21+dir.y*0.26,eR,[0.03,0.03,0.02],1,6,8);
  // Pupil slit (small dark ellipse)
  mb.sphere(hx+eoX+dir.x*0.01,ey+0.02,hz2+eoZ+dir.z*0.01,eR*0.55,[0.01,0.01,0.01],1,4,6);
  mb.sphere(hx-perp.x*0.21+dir.x*0.26+dir.x*0.01,ey+0.02,hz2-perp.y*0.21+dir.y*0.26+dir.y*0.01,eR*0.55,[0.01,0.01,0.01],1,4,6);
  // Eye highlight
  mb.sphere(hx+eoX+0.025,ey+0.032,hz2+eoZ+0.025,eR*0.28,[0.92,0.92,0.85],1,3,5);
  mb.sphere(hx-perp.x*0.21+dir.x*0.26+0.025,ey+0.032,hz2-perp.y*0.21+dir.y*0.26+0.025,eR*0.28,[0.92,0.92,0.85],1,3,5);

  // Tongue
  const tAnim=Math.sin(time*3.8)*0.5+0.5;
  if(tAnim>0.25){
    const tLen=0.28+tAnim*0.12,tFork=0.16,tY=BY-0.10;
    const tC=[0.72,0.06,0.06];
    mb.cyl(hx+dir.x*0.32,tY,hz2+dir.y*0.32,hx+dir.x*(0.32+tLen),tY+0.02,hz2+dir.y*(0.32+tLen),0.022,0.016,tC,1,0,0.4,4);
    mb.cyl(hx+dir.x*(0.32+tLen),tY+0.02,hz2+dir.y*(0.32+tLen),
           hx+dir.x*(0.32+tLen+tFork)+perp.x*tFork*0.4,tY+0.04,hz2+dir.y*(0.32+tLen+tFork)+perp.y*tFork*0.4,
           0.016,0.005,tC,1,0.4,0.8,4);
    mb.cyl(hx+dir.x*(0.32+tLen),tY+0.02,hz2+dir.y*(0.32+tLen),
           hx+dir.x*(0.32+tLen+tFork)-perp.x*tFork*0.4,tY+0.04,hz2+dir.y*(0.32+tLen+tFork)-perp.y*tFork*0.4,
           0.016,0.005,tC,1,0.4,0.8,4);
  }

  // ── Food (mouse) ────────────────────────────────────
  const fw=wx(food.x),fz3=wz(food.y);
  const fBob=Math.sin(foodPulse*2.2)*0.055;
  const mC=[0.52,0.46,0.42];
  mb.sphere(fw,0.19+fBob,fz3,0.26,mC,2,9,12);
  mb.sphere(fw+0.17,0.23+fBob,fz3,0.17,mC,2,7,10);
  mb.sphere(fw+0.21,0.36+fBob,fz3+0.10,0.075,[0.68,0.50,0.52],2,5,7);
  mb.sphere(fw+0.21,0.36+fBob,fz3-0.10,0.075,[0.68,0.50,0.52],2,5,7);
  mb.sphere(fw+0.29,0.27+fBob,fz3+0.075,0.028,[0.04,0.02,0.02],2,4,5);
  mb.sphere(fw+0.29,0.27+fBob,fz3-0.075,0.028,[0.04,0.02,0.02],2,4,5);
  // tiny whiskers (thin cylinders)
  mb.cyl(fw+0.30,0.22+fBob,fz3,fw+0.48,0.23+fBob,fz3+0.08,0.008,0.004,[0.75,0.70,0.65],2,0,1,3);
  mb.cyl(fw+0.30,0.22+fBob,fz3,fw+0.48,0.23+fBob,fz3-0.08,0.008,0.004,[0.75,0.70,0.65],2,0,1,3);
  // tail
  mb.cyl(fw-0.24,0.14+fBob,fz3,fw-0.52,0.10+fBob+Math.sin(foodPulse*2)*0.03,fz3+Math.sin(foodPulse)*0.07,0.035,0.012,[0.58,0.48,0.44],2,0,1,5);

  return mb.upload();
}

// ═══════════════════════════════════════════════
// MATRICES
// ═══════════════════════════════════════════════
const proj=m4(),view=m4(),mvp=m4();
perspective(proj,Math.PI/3.8,1.0,0.1,300.0);
// Camera pulled back further and raised higher so all 4 walls are clearly visible
const eyeDist=GRID*1.05;
const eye=[Math.sin(CAMERA_ANGLE)*eyeDist*0.55, eyeDist*1.05, Math.cos(CAMERA_ANGLE)*eyeDist*0.55];

function updateMVP(){
  lookAt(view,eye,[0,-0.2,0],[0,1,0]);
  mul(mvp,proj,view);
}
updateMVP();

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function drawMesh(m){ if(!m)return; bindMesh(m.vb,m.ib); gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_SHORT,0); }

function render(dt){
  time+=dt*0.001; foodPulse+=dt*0.001;
  if(!staticMesh) staticMesh=buildStatic();
  gl.clearColor(0.03,0.05,0.02,1.0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(U_MVP,false,mvp);
  gl.uniform3fv(U_CAM,new Float32Array(eye));
  gl.uniform1f(U_TIME,time);
  gl.uniform1f(U_FGLOW,0.25+0.25*Math.sin(foodPulse*4));
  drawMesh(staticMesh);
  const dyn=buildDynamic();
  drawMesh(dyn);
  gl.deleteBuffer(dyn.vb);
  gl.deleteBuffer(dyn.ib);
}

// ═══════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════
let lastTime=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  if(!started){render(dt);return;}
  if(gameOver){render(dt);return;}
  if(paused){render(0);return;}
  moveTimer+=dt;
  if(moveTimer>=moveInterval){moveTimer=0;dir={...nextDir};step();}
  render(dt);
}
function step(){
  const head=snake[0],nx=head.x+dir.x,ny=head.y+dir.y;
  if(nx<0||nx>=GRID||ny<0||ny>=GRID){showGameOver();return;}
  if(snake.slice(1).some(s=>s.x===nx&&s.y===ny)){showGameOver();return;}
  snake.unshift({x:nx,y:ny});
  if(nx===food.x&&ny===food.y){
    score+=10*level;
    document.getElementById('score').textContent=score;
    food=spawnFood();foodPulse=0;
    if(score>=level*100){level++;moveInterval=Math.max(80,180-level*15);document.getElementById('level').textContent=level;}
  } else snake.pop();
}

// ═══════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════
function screenToGridDir(sdx,sdy){
  const fwdX=-Math.sin(CAMERA_ANGLE),fwdZ=-Math.cos(CAMERA_ANGLE);
  const rgtX=Math.cos(CAMERA_ANGLE),rgtZ=-Math.sin(CAMERA_ANGLE);
  const wx2=sdx*rgtX+sdy*fwdX,wz2=sdx*rgtZ+sdy*fwdZ;
  if(Math.abs(wx2)>=Math.abs(wz2))return wx2>0?{x:1,y:0}:{x:-1,y:0};
  return wz2>0?{x:0,y:1}:{x:0,y:-1};
}
function trySetDir(sdx,sdy){
  const d=screenToGridDir(sdx,sdy);
  if(d.x===-dir.x&&d.y===-dir.y)return;
  nextDir=d;
}
document.addEventListener('keydown',e=>{
  switch(e.key){
    case 'ArrowUp':   case 'w':case 'W':trySetDir(0,1);break;
    case 'ArrowDown': case 's':case 'S':trySetDir(0,-1);break;
    case 'ArrowLeft': case 'a':case 'A':trySetDir(-1,0);break;
    case 'ArrowRight':case 'd':case 'D':trySetDir(1,0);break;
    case ' ':e.preventDefault();if(started&&!gameOver)paused=!paused;break;
    case 'r':case 'R':if(started){initGame();document.getElementById('overlay').classList.add('hidden');}break;
  }
});
let tx0,ty0;
canvas.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
  if(Math.abs(dx)>Math.abs(dy))trySetDir(dx>0?1:-1,0);else trySetDir(0,dy>0?-1:1);
  e.preventDefault();
},{passive:false});

initGame();started=false;
requestAnimationFrame(loop);
</script>
