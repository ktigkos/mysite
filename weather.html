<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090c10">
<title>Weather — My Site</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#090c10;--surface:#0e1318;--surface2:#141b22;--border:#1e2830;
    --accent:#00e5a0;--accent2:#00b4ff;--warn:#ff4f4f;
    --text:#c8d8e4;--muted:#4a5f6e;--hint:#3a4a58;
    --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
    --radius:6px;
    --glow:0 0 20px rgba(0,229,160,.18),0 0 60px rgba(0,229,160,.07);
    --glow2:0 0 20px rgba(0,180,255,.18),0 0 60px rgba(0,180,255,.07);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--mono);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,160,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  .blob{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:.4}
  .blob-1{width:500px;height:500px;background:rgba(0,229,160,.07);top:-100px;right:-100px}
  .blob-2{width:400px;height:400px;background:rgba(0,180,255,.07);bottom:10%;left:-80px}

  /* ── App shell ── */
  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px 80px}

  /* ── Nav ── */
  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 48px;border-bottom:1px solid var(--border)}
  .nav-logo{font-family:var(--sans);font-weight:800;font-size:1.1rem;letter-spacing:-.5px;color:#fff;text-decoration:none}
  .nav-logo span{color:var(--accent)}
  .nav-links{display:flex;gap:6px;flex-wrap:wrap}
  .nav-btn{font-family:var(--mono);font-size:.72rem;padding:7px 16px;border:1px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;display:inline-block}
  .nav-btn:hover,.nav-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,160,.06)}

  /* ── Page header ── */
  .section-header{padding:60px 0 40px}
  .section-tag{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .section-title{font-family:var(--sans);font-size:2.2rem;font-weight:800;color:#fff;letter-spacing:-1.5px;margin-bottom:6px}
  .section-sub{font-size:.78rem;color:var(--muted);line-height:1.7}

  /* ── Search ── */
  .search-wrap{position:relative;margin-bottom:2.5rem}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  .search-input{
    flex:1;min-width:200px;height:44px;padding:0 16px;
    font-family:var(--mono);font-size:.82rem;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,160,.08)}
  .btn{
    height:44px;padding:0 16px;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid var(--border);border-radius:var(--radius);
    color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:all .2s;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .btn svg{flex-shrink:0}
  #suggestions{
    position:absolute;top:50px;left:0;right:0;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);z-index:100;overflow:hidden;display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .sug{padding:11px 16px;font-size:.78rem;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text);display:flex;justify-content:space-between;align-items:center;transition:background .15s,color .15s}
  .sug:last-child{border-bottom:none}
  .sug:hover{background:rgba(0,229,160,.06);color:var(--accent)}
  .sug-country{font-size:.68rem;color:var(--muted);letter-spacing:.04em}

  /* ── Hero ── */
  .hero{margin-bottom:2rem}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1.5rem;margin-bottom:1rem}
  .location-line{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--muted);margin-bottom:10px;letter-spacing:.12em;text-transform:uppercase}
  .location-line svg{color:var(--accent);flex-shrink:0}
  .city-name{font-family:var(--sans);font-size:clamp(2rem,5.5vw,3rem);font-weight:800;line-height:1.05;color:#fff;letter-spacing:-1.5px}
  .condition-text{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:10px;letter-spacing:.04em}

  .temp-block{text-align:right}
  .wx-icon{font-size:3rem;line-height:1;margin-bottom:6px}
  .big-temp{font-family:var(--sans);font-size:clamp(2.8rem,8.5vw,4.8rem);font-weight:800;line-height:1;color:#fff;letter-spacing:-2px}
  .big-temp sup{font-family:var(--mono);font-size:1rem;font-weight:400;vertical-align:top;margin-top:.6rem;display:inline-block;color:var(--accent)}
  .hi-lo{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:8px;letter-spacing:.04em}

  .unit-toggle{display:flex;gap:4px;margin-top:12px;justify-content:flex-end}
  .unit-btn{
    padding:6px 14px;font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;
    border-radius:var(--radius);border:1px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;transition:all .2s;
  }
  .unit-btn:hover{border-color:var(--accent2);color:var(--accent2)}
  .unit-btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

  /* ── Divider ── */
  .divider{border:none;border-top:1px solid var(--border);margin:0 0 2rem}

  /* ── Metrics ── */
  .metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:2.5rem}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .2s,box-shadow .2s}
  .metric:hover{border-color:var(--accent2);box-shadow:var(--glow2)}
  .metric-label{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
  .metric-val{font-family:var(--sans);font-size:1.35rem;font-weight:700;color:#fff;letter-spacing:-.5px}
  .metric-sub{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:4px;letter-spacing:.04em}

  /* ── Section labels ── */
  .section-label{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:14px}

  /* ── Hourly ── */
  .hourly-row{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-bottom:2.5rem}
  .hourly-row::-webkit-scrollbar{height:4px}
  .hourly-row::-webkit-scrollbar-track{background:transparent}
  .hourly-row::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  .hourly-row::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  .hourly-row .hcard{min-width:0;padding:12px 4px}
  .hcard{flex:0 0 68px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;transition:border-color .2s,transform .2s}
  .hcard:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .hcard.now{border-color:var(--accent);background:rgba(0,229,160,.06);box-shadow:var(--glow)}
  .htime{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
  .hcard.now .htime{color:var(--accent)}
  .hicon{font-size:1.2rem;line-height:1;margin-bottom:6px}
  .htemp{font-family:var(--sans);font-size:.9rem;font-weight:700;color:#fff}
  .hrain{font-family:var(--mono);font-size:.62rem;color:var(--accent2);margin-top:4px;letter-spacing:.04em}

  /* ── Forecast ── */
  .forecast-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:2.5rem}
  .fday{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;text-align:center;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
  .fday:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:var(--glow2)}
  .fday.today{border-color:var(--border)}
  .fday.selected{border-color:var(--accent);background:rgba(0,229,160,.06);box-shadow:var(--glow)}
  .fday-name{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-bottom:10px;letter-spacing:.08em;text-transform:uppercase}
  .fday.selected .fday-name{color:var(--accent)}
  .fday-icon{font-size:1.4rem;line-height:1;margin-bottom:10px}
  .fday-hi{font-family:var(--sans);font-size:1rem;font-weight:700;color:#fff}
  .fday-lo{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:3px}

  /* ── Day detail panel ── */
  .day-detail{
    margin-top:-1.5rem;margin-bottom:2.5rem;
    background:var(--surface);border:1px solid var(--accent);
    border-radius:var(--radius);padding:20px;
    box-shadow:var(--glow);
    animation:fadeUp .3s ease both;
  }
  .day-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .day-detail-title{font-family:var(--sans);font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:-.5px}
  .day-detail-sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:4px;letter-spacing:.04em}
  .day-detail-temps{margin-left:auto;text-align:right;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .day-detail-temps strong{font-family:var(--sans);font-size:1.05rem;color:#fff;font-weight:700;letter-spacing:-.3px}
  .day-detail-hourly{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
  .day-detail-hourly::-webkit-scrollbar{height:4px}
  .day-detail-hourly::-webkit-scrollbar-track{background:transparent}
  .day-detail-hourly::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
  .day-detail-hourly::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  /* ── States ── */
  .state{
    text-align:center;padding:60px 20px;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);
    font-family:var(--mono);font-size:.82rem;color:var(--muted);letter-spacing:.04em;
  }
  .state p{margin-bottom:.5rem}
  .dots span{animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}

  /* ── Fade in ── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeUp .4s ease both}

  /* ── Footer ── */
  footer{margin-top:80px;padding-top:28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .footer-left{font-size:.7rem;color:var(--muted)}
  .footer-left a{color:var(--accent);text-decoration:none}

  /* ── Responsive ── */
  @media(max-width:900px){
    .metrics-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media(max-width:640px){
    .metrics-grid{grid-template-columns:repeat(2,1fr)}
    .forecast-grid{grid-template-columns:repeat(4,1fr)}
    .hero-top{flex-direction:column}
    .temp-block{text-align:left}
    .unit-toggle{justify-content:flex-start}
    .hourly-row{display:flex;overflow-x:auto;padding-bottom:8px}
  }
  @media(max-width:580px){
    nav{flex-direction:column;gap:16px}
    .nav-links{overflow-x:auto;scrollbar-width:none;width:100%}
    .nav-links::-webkit-scrollbar{display:none}
    .nav-btn{white-space:nowrap;flex-shrink:0}
    footer{flex-direction:column;gap:8px;text-align:center}
  }
  @media(max-width:400px){
    .forecast-grid{grid-template-columns:repeat(3,1fr)}
    .fday:nth-child(n+4):nth-child(-n+7){display:none}
  }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="app">

  <nav>
    <a href="index.html" class="nav-logo">my<span>.</span>site</a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="index.html#contacts" class="nav-btn" onclick="goSection('contact')">Contacts</a>
      <a href="index.html#notepad"  class="nav-btn" onclick="goSection('notepad')">Notepad</a>
      <a href="weather.html"        class="nav-btn active">Weather</a>
      <a href="gallery.html"        class="nav-btn">Gallery</a>
    </div>
  </nav>

  <div class="section-header">
    <div class="section-tag">// weather</div>
    <h2 class="section-title">Live Weather</h2>
    <p class="section-sub">Search any city or use your location. Powered by Open-Meteo.</p>
  </div>

  <div class="search-wrap">
    <div class="search-row">
      <input class="search-input" id="search" type="text" placeholder="Search any city…" autocomplete="off" spellcheck="false">
      <button class="btn" id="gps-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.5"/>
          <line x1="8" y1="1" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="15"/>
          <line x1="1" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="15" y2="8"/>
        </svg>
        My location
      </button>
    </div>
    <div id="suggestions"></div>
  </div>

  <div id="content">
    <div class="state">
      Fetching your location<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>

  <footer>
    <div class="footer-left">my.site — weather powered by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></div>
  </footer>

</div>

<script>
const WMO = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
const ICON = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'❄️',75:'❄️',80:'🌦️',81:'🌦️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

let cel = true, wxData = null, cityName = '', countryName = '';

const ic = c => ICON[c] || '🌡️';
const desc = c => WMO[c] || '';
const toF = c => Math.round(c * 9/5 + 32);
const fmt = c => cel ? Math.round(c) : toF(c);
const u = () => cel ? '°C' : '°F';
const $ = id => document.getElementById(id);

function windDir(deg) {
  return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg / 45) % 8];
}
function uvLabel(v) {
  if (!v && v !== 0) return '';
  if (v <= 2) return 'Low';
  if (v <= 5) return 'Moderate';
  if (v <= 7) return 'High';
  if (v <= 10) return 'Very high';
  return 'Extreme';
}

function render() {
  if (!wxData) return;
  const c = wxData.current, d = wxData.daily, h = wxData.hourly;
  const now = new Date();
  const nowHour = now.getHours();

  // Find hourly start index near current hour
  let hStart = h.time.findIndex(t => {
    const dt = new Date(t);
    return dt.toDateString() === now.toDateString() && dt.getHours() >= nowHour;
  });
  if (hStart < 0) hStart = 0;
  const hSlice = h.time.slice(hStart, hStart + 12);

  const hoursHTML = hSlice.map((t, i) => {
    const dt = new Date(t);
    const label = i === 0 ? 'Now' : dt.getHours().toString().padStart(2,'0') + ':00';
    const idx = hStart + i;
    const rain = h.precipitation_probability[idx] || 0;
    return `<div class="hcard${i === 0 ? ' now' : ''}">
      <div class="htime">${label}</div>
      <div class="hicon">${ic(h.weather_code[idx])}</div>
      <div class="htemp">${fmt(h.temperature_2m[idx])}${u()}</div>
      ${rain > 20 ? `<div class="hrain">${rain}%</div>` : ''}
    </div>`;
  }).join('');

const foreHTML = d.time.map((dt, i) => {
    const day = new Date(dt + 'T12:00:00');
    const name = i === 0 ? 'Today' : DAYS[day.getDay()];
    return `<div class="fday${i === 0 ? ' today' : ''}" onclick="showDayDetail(${i})" style="cursor:pointer">
      <div class="fday-name">${name}</div>
      <div class="fday-icon">${ic(d.weather_code[i])}</div>
      <div class="fday-hi">${fmt(d.temperature_2m_max[i])}${u()}</div>
      <div class="fday-lo">${fmt(d.temperature_2m_min[i])}${u()}</div>
    </div>`;
  }).join('');

  const uvVal = d.uv_index_max ? d.uv_index_max[0] : null;
  const vis = c.visibility != null ? Math.round(c.visibility / 1000) + ' km' : '–';
  const rainChance = c.precipitation_probability != null ? c.precipitation_probability : (h.precipitation_probability[hStart] || 0);

  $('content').innerHTML = `
    <div class="hero fade-in">
      <div class="hero-top">
        <div class="hero-left">
          <div class="location-line">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="8" cy="7" r="2.5"/>
              <path d="M8 2C5.24 2 3 4.24 3 7c0 3.75 5 9 5 9s5-5.25 5-9c0-2.76-2.24-5-5-5z"/>
            </svg>
            ${countryName}
          </div>
          <div class="city-name">${cityName}</div>
          <div class="condition-text">${desc(c.weather_code)}</div>
        </div>
        <div class="temp-block">
          <div class="wx-icon">${ic(c.weather_code)}</div>
          <div class="big-temp">${fmt(c.temperature_2m)}<sup>${u()}</sup></div>
          <div class="hi-lo">H ${fmt(d.temperature_2m_max[0])}${u()} &nbsp;·&nbsp; L ${fmt(d.temperature_2m_min[0])}${u()}</div>
          <div class="unit-toggle">
            <button class="unit-btn${cel ? ' on' : ''}" onclick="setUnit(true)">°C</button>
            <button class="unit-btn${!cel ? ' on' : ''}" onclick="setUnit(false)">°F</button>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <div class="metrics-grid fade-in" style="animation-delay:0.05s">
      <div class="metric">
        <div class="metric-label">Feels like</div>
        <div class="metric-val">${fmt(c.apparent_temperature)}${u()}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Humidity</div>
        <div class="metric-val">${Math.round(c.relative_humidity_2m)}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Wind</div>
        <div class="metric-val">${Math.round(c.wind_speed_10m)}</div>
        <div class="metric-sub">km/h · ${windDir(c.wind_direction_10m)}</div>
      </div>
      <div class="metric">
        <div class="metric-label">UV index</div>
        <div class="metric-val">${uvVal != null ? Math.round(uvVal) : '–'}</div>
        <div class="metric-sub">${uvLabel(uvVal)}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Rain chance</div>
        <div class="metric-val">${Math.round(rainChance)}%</div>
      </div>
      <div class="metric">
        <div class="metric-label">Precipitation</div>
        <div class="metric-val">${c.precipitation != null ? c.precipitation.toFixed(1) : '0'}</div>
        <div class="metric-sub">mm now</div>
      </div>
      <div class="metric">
        <div class="metric-label">Visibility</div>
        <div class="metric-val">${vis}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Pressure</div>
        <div class="metric-val">${c.pressure_msl != null ? Math.round(c.pressure_msl) : '–'}</div>
        <div class="metric-sub">hPa</div>
      </div>
    </div>

    <div class="section-label fade-in" style="animation-delay:0.1s">Next 12 hours</div>
    <div class="hourly-row fade-in" style="animation-delay:0.12s">${hoursHTML}</div>

    <div class="section-label fade-in" style="animation-delay:0.15s">7-day forecast</div>
    <div class="forecast-grid fade-in" style="animation-delay:0.18s">${foreHTML}</div>
  `;
}

let selectedDay = null;
function showDayDetail(i) {
  const d = wxData.daily, h = wxData.hourly;

  // Toggle off if same day clicked again
  if (selectedDay === i) {
    selectedDay = null;
    document.querySelectorAll('.fday').forEach(el => el.classList.remove('selected'));
    const existing = document.getElementById('day-detail');
    if (existing) existing.remove();
    return;
  }
  selectedDay = i;

  // Highlight selected card
  document.querySelectorAll('.fday').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });

  // Find hourly slice for this day
  const dateStr = d.time[i];
  const dayStart = h.time.findIndex(t => t.startsWith(dateStr));
  const slice = dayStart >= 0 ? h.time.slice(dayStart, dayStart + 24) : [];

  const hoursHTML = slice.map((t, j) => {
    const idx = dayStart + j;
    const hour = new Date(t).getHours().toString().padStart(2, '0') + ':00';
    const rain = h.precipitation_probability[idx] || 0;
    return `<div class="hcard">
      <div class="htime">${hour}</div>
      <div class="hicon">${ic(h.weather_code[idx])}</div>
      <div class="htemp">${fmt(h.temperature_2m[idx])}${u()}</div>
      ${rain > 20 ? `<div class="hrain">${rain}%</div>` : ''}
    </div>`;
  }).join('');

  const day = new Date(dateStr + 'T12:00:00');
  const name = i === 0 ? 'Today' : DAYS[day.getDay()] + ', ' + day.toLocaleDateString('en', { month: 'short', day: 'numeric' });
  const uvVal = d.uv_index_max ? d.uv_index_max[i] : null;

  const html = `<div class="day-detail" id="day-detail">
    <div class="day-detail-header">
      <div>
        <div class="day-detail-title">${name}</div>
        <div class="day-detail-sub">${ic(d.weather_code[i])} ${desc(d.weather_code[i])}</div>
      </div>
      <div class="day-detail-temps">
        <strong>H ${fmt(d.temperature_2m_max[i])}${u()}</strong><br>
        L ${fmt(d.temperature_2m_min[i])}${u()}
        ${uvVal != null ? `<br><span style="color:var(--hint);font-size:11px">UV ${Math.round(uvVal)} · ${uvLabel(uvVal)}</span>` : ''}
      </div>
    </div>
    <div class="day-detail-hourly">${hoursHTML}</div>
  </div>`;

  // Insert after the forecast grid
  const grid = document.querySelector('.forecast-grid');
  const existing = document.getElementById('day-detail');
  if (existing) existing.remove();
  grid.insertAdjacentHTML('afterend', html);
  document.getElementById('day-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setUnit(c) { cel = c; render(); }

function loading(msg) {
  $('content').innerHTML = `<div class="state">${msg}<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>`;
}

async function loadWeather(lat, lon, city, country) {
  cityName = city; countryName = country;
  loading('Loading weather');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,precipitation,precipitation_probability,visibility,pressure_msl&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=auto&forecast_days=7`;
    const r = await fetch(url);
    wxData = await r.json();
    render();
  } catch(e) {
    $('content').innerHTML = '<div class="state"><p>Could not load weather data.</p><p style="font-size:13px;color:var(--hint)">Check your connection and try again.</p></div>';
  }
}

async function reverseGeo(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
    const d = await r.json();
    const city = d.address?.city || d.address?.town || d.address?.village || d.address?.county || 'Unknown';
    return [city, d.address?.country || ''];
  } catch { return ['Your location', '']; }
}

function useGPS() {
  if (!navigator.geolocation) { loadWeather(37.9838, 23.7275, 'Athens', 'Greece'); return; }
  loading('Getting your location');
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    const [city, country] = await reverseGeo(lat, lon);
    loadWeather(lat, lon, city, country);
  }, () => loadWeather(37.9838, 23.7275, 'Athens', 'Greece'));
}

// Search
let sugTimer = null;
$('search').addEventListener('input', function() {
  clearTimeout(sugTimer);
  const q = this.value.trim();
  if (q.length < 2) { $('suggestions').style.display = 'none'; return; }
  sugTimer = setTimeout(() => fetchSuggestions(q), 320);
});
$('search').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const q = this.value.trim();
    if (q) fetchSuggestions(q, true);
  }
  if (e.key === 'Escape') $('suggestions').style.display = 'none';
});
$('gps-btn').addEventListener('click', useGPS);
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) $('suggestions').style.display = 'none';
});

async function fetchSuggestions(q, pickFirst = false) {
  try {
    const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
    const d = await r.json();
    if (!d.results?.length) {
      $('suggestions').innerHTML = '<div class="sug" style="color:var(--hint);cursor:default">No results found</div>';
      $('suggestions').style.display = 'block';
      return;
    }
    if (pickFirst) { selectLocation(d.results[0]); return; }
    $('suggestions').innerHTML = d.results.map(loc => `
      <div class="sug" data-lat="${loc.latitude}" data-lon="${loc.longitude}" data-city="${loc.name}" data-country="${loc.country || ''}">
        <span>${loc.name}${loc.admin1 ? ', ' + loc.admin1 : ''}</span>
        <span class="sug-country">${loc.country || ''}</span>
      </div>`).join('');
    $('suggestions').style.display = 'block';
    $('suggestions').querySelectorAll('.sug').forEach(item => {
      item.addEventListener('click', () => selectLocation({
        latitude: +item.dataset.lat, longitude: +item.dataset.lon,
        name: item.dataset.city, country: item.dataset.country
      }));
    });
  } catch {}
}

function selectLocation(loc) {
  $('search').value = loc.name;
  $('suggestions').style.display = 'none';
  loadWeather(loc.latitude, loc.longitude, loc.name, loc.country || '');
}

function goSection(page) {
  sessionStorage.setItem('goto', page);
}

// Boot
useGPS();
</script>
