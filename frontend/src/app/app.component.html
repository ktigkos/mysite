<div class="grid-bg"></div>
<div class="noise"></div>
<div class="corner-accent top-left"></div>
<div class="corner-accent top-right"></div>
<div class="corner-accent bottom-left"></div>
<div class="corner-accent bottom-right"></div>

<header class="hud-bar">
  <div class="hud-left">
    <span class="hud-tag">SYS</span>
    <a class="logo" routerLink="/">MY<span class="logo-dot">.</span>SITE</a>
    <span class="hud-tag status-online">◉ ONLINE</span>
  </div>

  <nav class="nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
      <span class="nav-num">01</span> HOME
    </a>
    <a routerLink="/contact" routerLinkActive="active" class="nav-item">
      <span class="nav-num">02</span> CONTACT
    </a>
    <a routerLink="/notepad" routerLinkActive="active" class="nav-item">
      <span class="nav-num">03</span> NOTEPAD
    </a>
  </nav>

  <div class="hud-right">
    <span class="hud-tag">{{ time }}</span>
    <span class="hud-divider">|</span>
    <span class="hud-tag">v2.0</span>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="hud-footer">
  <span class="hud-tag">X:{{ mouseX }} Y:{{ mouseY }}</span>
  <span class="hud-center">
    <a href="snake.html" class="footer-link">▸ SNAKE</a>
    <span class="hud-divider">·</span>
    <a href="snake3d.html" class="footer-link">▸ SNAKE_3D</a>
  </span>
  <span class="hud-tag">© MYSITE SYSTEMS</span>
</footer>
