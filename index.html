<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My site</title>
	<link rel="icon" type="image/png" href="favicon.png">
	
	 <style>
        /* Simple notepad styles - non-invasive, only targets new elements */
        .notepad-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            max-width: 500px;
        }
        .notepad-section textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        .notepad-section button {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .notepad-section button:hover {
            background-color: #45a049;
        }
        .last-saved {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
        .ws-status {
            font-size: 11px;
            margin-bottom: 6px;
        }
        .ws-status.connected { color: #4CAF50; }
        .ws-status.disconnected { color: #e53935; }
        .ws-status.connecting { color: #fb8c00; }
    </style>
</head>

<body>
<h1>My Site</h1>
<a href="snake.html" style="font-weight: bold; font-size: 18px;">Snake</a>&emsp;
<a href="snake3d.html" style="font-weight: bold; font-size: 18px;">Snake 3D</a>
<br><br>
<h2>Add Contact</h2>
  <form method="POST" action="/submit">
    <label>First Name</label>
    <input type="text" name="first_name" required>

    <label>Last Name</label>
    <input type="text" name="last_name" required>

    <label>Phone</label>
    <input type="tel" name="phone" required>

    <button type="submit">Save Contact</button>
  </form>
  
  <br><br>
  
  <!-- Real-time Notepad Section -->
  <div class="notepad-section">
    <h2>Notepad</h2>
    <div class="ws-status connecting" id="wsStatus">⬤ Connecting...</div>
    <textarea id="notepad" placeholder="Write your notes here..."></textarea>
    <button onclick="clearNote()">Clear</button>
    <div class="last-saved" id="lastSaved"></div>
  </div>
  
  <script>
  // ─── Contact form status message (unchanged) ───────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  const msg = document.createElement('p');

  if (status === 'success') {
    msg.style.color = 'green';
    msg.textContent = 'Contact saved successfully!';
  } else if (status === 'missing') {
    msg.style.color = 'orange';
    msg.textContent = 'Please fill in all fields.';
  } else if (status === 'error') {
    msg.style.color = 'red';
    msg.textContent = 'A database error occurred.';
  }

  if (status) document.querySelector('form').after(msg);

  // ─── Real-time Notepad via WebSocket ──────────────────────────────────────
  const notepad   = document.getElementById('notepad');
  const wsStatus  = document.getElementById('wsStatus');
  const lastSaved = document.getElementById('lastSaved');

  let ws;
  let isRemoteUpdate = false;

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${protocol}://${location.host}`);

    ws.onopen = () => {
      wsStatus.textContent = '⬤ Connected — syncing in real-time';
      wsStatus.className = 'ws-status connected';
    };

    ws.onclose = () => {
      wsStatus.textContent = '⬤ Disconnected — reconnecting...';
      wsStatus.className = 'ws-status disconnected';
      setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      wsStatus.textContent = '⬤ Connection error';
      wsStatus.className = 'ws-status disconnected';
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'init') {
        isRemoteUpdate = true;
        notepad.value = msg.content;
        isRemoteUpdate = false;
      } else if (msg.type === 'update') {
        isRemoteUpdate = true;
        notepad.value = msg.content;
        isRemoteUpdate = false;
        notepad.scrollTop = notepad.scrollHeight;
        updateLastSavedTime('Synced from another device');
      }
    };
  }

  notepad.addEventListener('input', () => {
    if (isRemoteUpdate) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'update', content: notepad.value }));
      updateLastSavedTime('Saving...');
      clearTimeout(notepad._saveLabel);
      notepad._saveLabel = setTimeout(() => updateLastSavedTime('Saved'), 600);
    }
  });

  function clearNote() {
    if (confirm('Clear all notes?')) {
      notepad.value = '';
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'update', content: '' }));
      }
      lastSaved.textContent = '';
    }
  }

  function updateLastSavedTime(label) {
    const now = new Date();
    lastSaved.textContent = `${label} — ${now.toLocaleTimeString()}`;
  }

  connect();
  </script>

</body>
</html>
