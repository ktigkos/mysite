<!DOCTYPE html>
<html>
<head>
    <title>Ssssnake</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #333;
            font-family: Arial, sans-serif;
        }
        
        .game-box {
            text-align: center;
              background: #555;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px #0f0;

        }
        
        canvas {
            border: 3px solid #333;
            background: #000;
            display: block;
            margin: 20px auto;
        }
        
        #score {
            font-size: 24px;
            font-weight: bold;
            /* color: #333; */
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #message {
            color: red;
            font-weight: bold;
            min-height: 30px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="game-box">
        <!-- <h1>SSSSSnake</h1> -->
		<img src="fidi.jpg" alt="FIDI" style="width: 150px; margin: 10px auto; display: block;">
        <div>Score: <span id="score">0</span></div>
        <div id="message"></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <button onclick="startGame()">START NEW GAME</button>
        <p>Use arrow keys to move</p>
    </div>

    <script>
        // Get elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const messageDiv = document.getElementById('message');

        // Game variables
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameActive = false;
        let gameInterval;
        
        // Grid settings
        const gridSize = 20;
        const cellSize = 20;

        // Initialize game
        function init() {
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            scoreSpan.textContent = '0';
            messageDiv.textContent = '';
            placeFood();
        }

        // Place food randomly
        function placeFood() {
            let validPosition = false;
            let attempts = 0;
            const maxAttempts = 1000;
            
            while (!validPosition && attempts < maxAttempts) {
                food = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
                
                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
                attempts++;
            }
            
            if (attempts >= maxAttempts) {
                // If can't place food, you probably won!
                messageDiv.textContent = 'YOU WIN!';
                stopGame();
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw snake
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    ctx.fillStyle = 'lightgreen'; // Head
                } else {
                    ctx.fillStyle = 'green'; // Body
                }
                
                ctx.fillRect(
                    snake[i].x * cellSize, 
                    snake[i].y * cellSize, 
                    cellSize - 2, 
                    cellSize - 2
                );
            }
            
            // Draw food
            ctx.fillStyle = 'red';
            ctx.fillRect(
                food.x * cellSize, 
                food.y * cellSize, 
                cellSize - 2, 
                cellSize - 2
            );
        }

        // Move snake
        function move() {
            if (!gameActive) return;
            
            // Update direction
            direction = nextDirection;
            
            // Calculate new head position
            let newHead = {x: snake[0].x, y: snake[0].y};
            
            switch(direction) {
                case 'right':
                    newHead.x++;
                    break;
                case 'left':
                    newHead.x--;
                    break;
                case 'up':
                    newHead.y--;
                    break;
                case 'down':
                    newHead.y++;
                    break;
            }
            
            // Check wall collision
            if (newHead.x < 0 || newHead.x >= gridSize || 
                newHead.y < 0 || newHead.y >= gridSize) {
                gameOver('WALL HIT!');
                return;
            }
            
            // Check self collision (except the tail which will move)
            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
                    gameOver('ATE YOURSELF!');
                    return;
                }
            }
            
            // Add new head
            snake.unshift(newHead);
            
            // Check food collision
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreSpan.textContent = score;
                placeFood();
            } else {
                // Remove tail
                snake.pop();
            }
            
            // Draw updated game
            draw();
        }

        // Game over
        function gameOver(reason) {
            gameActive = false;
            stopGame();
            messageDiv.textContent = 'GAME OVER! ' + reason;
        }

        // Stop game interval
        function stopGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }

        // Start game
        function startGame() {
            stopGame();
            init();
            gameActive = true;
            draw();
            gameInterval = setInterval(move, 150);
        }

        // Keyboard controls
        document.addEventListener('keydown', function(e) {
            if (!gameActive) return;
            
            // Prevent page scrolling
            if (e.key.startsWith('Arrow')) {
                e.preventDefault();
            }
            
            // Change direction (prevent going back into yourself)
            switch(e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
            }
        });

        // Touch/swipe controls
        let touchStartX = null;
        let touchStartY = null;

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            if (touchStartX === null || touchStartY === null || !gameActive) return;

            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            // Require a minimum swipe distance to avoid accidental triggers
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal swipe
                if (dx > 0 && direction !== 'left') nextDirection = 'right';
                else if (dx < 0 && direction !== 'right') nextDirection = 'left';
            } else {
                // Vertical swipe
                if (dy > 0 && direction !== 'up') nextDirection = 'down';
                else if (dy < 0 && direction !== 'down') nextDirection = 'up';
            }

            touchStartX = null;
            touchStartY = null;
        }, { passive: true });

        // Start game automatically when page loads
        window.onload = function() {
            startGame();
        };
    </script>
</body>
</html>
